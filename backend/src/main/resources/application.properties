spring.application.name=bean-order

# 프로필을 지정하지 않으면 local 로 실행
spring.profiles.default=local

server.port=8080

# CORS 허용 Origin (쉼표로 구분, * 사용 불가)
# 배포 주소 추가 예: 환경변수 CORS_ALLOWED_ORIGINS=http://localhost:5173,https://xxx.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# 관리자 인증
# 비밀번호는 환경변수 ADMIN_PASSWORD 로만 받는다. 기본값 없음: 없거나 비어 있으면 서버 시작 실패.
app.admin.password=${ADMIN_PASSWORD:}
# 토큰 유효 시간 (팀 확정 전 임시값 1시간). 환경변수 APP_ADMIN_TOKEN_TTL 로 변경 가능 (예: 30m, 2h)
app.admin.token-ttl=1h
# 메모리에 보관할 유효 토큰 최대 개수. 넘으면 가장 오래된 토큰부터 제거
app.admin.max-active-tokens=100

# 시간 기준: Asia/Seoul (JVM 기본 시간대는 BeanOrderApplication.main 에서 설정)
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.jpa.open-in-view=false
