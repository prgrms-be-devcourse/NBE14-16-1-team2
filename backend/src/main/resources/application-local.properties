# local: H2 파일 DB -> backend/data/bean-order.mv.db (Git 제외)
# 상대 경로이므로 backend 폴더에서 실행한다.
spring.datasource.url=jdbc:h2:file:./data/bean-order
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa

# 비밀번호는 Git에서 제외된 config/local-db.properties 에서 읽는다.
# (형식은 config/local-db.properties.example 참고)
spring.config.import=optional:file:./config/local-db.properties
spring.datasource.password=${LOCAL_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
